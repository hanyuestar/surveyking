# H2 嵌入式模式配置（java -jar surveyking-v1.0.0.jar 默认体验模式，免安装数据库）
# 对应官方 v1.12.0 的 config/application-h2.yml；本地 v1.9.0 结构为 rdbms 模块 config 目录。
# 说明：sql.init.mode=always 会在每次启动时执行 classpath:scripts/init-h2.sql（建表 + 种子数据，幂等）；
#       行政区字典（region）大数据不并入 init-h2.sql，由 RegionDictH2Initializer 启动时检查存在性、只导入一次。
spring:
  h2:
    console:
      enabled: false
  datasource:
    username: sa
    password: sa
    url: jdbc:h2:./db/surveyking;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
  sql:
    init:
      continue-on-error: true
      mode: always
      schema-locations: classpath:scripts/init-h2.sql
# H2 体验模式必须配置 custom-cache.entries：
# CacheConfig.cacheManager() 会读取该 Map 为每个缓存名设置 TTL，缺失时 entries 为 null，
# 触发 entries.entrySet() 空指针（应用启动即退出，且无明确报错信息）。
# pro/dev 配置已包含，h2 此前遗漏，此处补齐，与 pro 保持一致。
custom-cache:
  entries:
    projectCache: 1d
    fileCache: 1h
    userCache: 1d
    deptCache: 1d
    projectPermissionCache: 1d
    commonCache: 30d
# H2 体验模式必须配置 file-storage.local.root-path：
# FileServiceImpl（@Service + @RequiredArgsConstructor）强制注入 StorageService，
# 而 StorageAutoConfiguration.storageService() 由
# @ConditionalOnProperty(prefix = "file-storage.local", name = "root-path") 门控；
# 若未配置该属性，storageService Bean 不会被创建，FileServiceImpl 依赖无法满足，
# 导致应用启动即失败（与 custom-cache 漏配同类的 profile 缺口问题）。
# pro/dev 配置已包含，此处补齐，与 pro 保持一致。
file-storage:
  local:
    root-path: ./files
# H2 体验模式：init-h2.sql 仅含业务表，Flowable 工作流表（ACT_*）未包含；
# 必须允许 Flowable 自动建表，否则引擎初始化失败导致应用启动即退出。
# 注意：本 fork 当前已禁用 flow 模块（server/pom.xml 中 <module>flow</module> 被注释，
#       且 api 模块不依赖 flow），flowable-spring-boot-starter 不在运行时 classpath 上，
#       Spring Boot 不会自动创建 ProcessEngine，因此下方 database-schema-update 当前为无效配置，
#       且 init-mysql.sql 实际上【并不包含】ACT_* 表也不会引发问题。
#       若日后重新启用 flow 模块，需改为 true 或在 init-mysql.sql 中补入 ACT_* 建表语句。
flowable:
  database-schema-update: true
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    call-setters-on-nulls: false
  global-config:
    db-config:
      logic-delete-field: deleted
