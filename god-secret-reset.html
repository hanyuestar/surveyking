<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SurveyKing 外挂密码重置工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: rgba(0,0,0,0.85);
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 10px; padding: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: rgba(0,0,0,0.45); margin: 0 0 20px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: rgba(0,0,0,0.65); margin-bottom: 6px; }
  .field input {
    width: 100%; height: 36px; padding: 4px 11px; font-size: 14px;
    border: 1px solid #d9d9d9; border-radius: 6px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #3873f6; }
  .btn {
    height: 36px; padding: 0 16px; font-size: 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.85); transition: all .2s;
  }
  .btn:hover { border-color: #3873f6; color: #3873f6; }
  .btn-primary { background: #3873f6; border-color: #3873f6; color: #fff; }
  .btn-primary:hover { background: #2b5fd6; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; }
  .divider { height: 1px; background: #f0f0f0; margin: 22px 0; }
  .status {
    margin-top: 14px; padding: 12px 14px; border-radius: 6px; font-size: 13px; line-height: 1.7;
    display: none; white-space: pre-wrap; word-break: break-all;
  }
  .status.show { display: block; }
  .status.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
  .status.err { background: #fff1f0; border: 1px solid #ffccc7; color: #cf1322; }
  .status.info { background: #e6f4ff; border: 1px solid #91caff; color: #0958d9; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .tag.on { background: #f6ffed; color: #389e0d; }
  .tag.off { background: #fff1f0; color: #cf1322; }
  code { background: #f5f5f5; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🔑 SurveyKing 外挂密码重置工具</h1>
    <p class="sub">
      本页面直接调用 SurveyKing 的 <code>/api/public/resetPassword</code> 接口重置任意账户密码（含 admin）。<br/>
      后端 CORS 已开放（<code>*</code>），本页以 <code>file://</code> 打开亦可跨域访问你的服务。<br/>
      前提：服务端部署时设置了 <code>GOD_SECRET</code> 环境变量；可用下方"检测状态"先确认。
    </p>

    <div class="field">
      <label>服务地址（API Base URL，不含末尾斜杠）</label>
      <input id="base" type="text" value="https://survey.hanyueppy.synology.me:60005" />
    </div>
    <div class="row">
      <button class="btn" id="checkBtn">检测外挂密码状态</button>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>外挂密码（GOD_SECRET）</label>
      <input id="godSecret" type="password" placeholder="部署时设置的 GOD_SECRET" />
    </div>
    <div class="field">
      <label>账户名</label>
      <input id="username" type="text" value="admin" />
    </div>
    <div class="field">
      <label>新密码</label>
      <input id="newPassword" type="password" placeholder="要设置的新密码" />
    </div>
    <div class="row">
      <button class="btn btn-primary" id="resetBtn">重置密码</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
  function el(id) { return document.getElementById(id); }
  function setStatus(kind, text) {
    var s = el('status');
    s.className = 'status show ' + kind;
    s.textContent = text;
  }

  function checkStatus() {
    var base = el('base').value.trim().replace(/\/+$/, '');
    if (!base) { setStatus('err', '请填写服务地址'); return; }
    setStatus('info', '正在请求 ' + base + '/api/system …');
    fetch(base + '/api/system', { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var enabled = !!(data && data.data && data.data.isGodSecretEnabled === true);
        var tag = enabled
          ? '<span class="tag on">已启用</span>'
          : '<span class="tag off">未启用</span>';
        setStatus('info',
          '外挂密码状态：' + tag + '\n' +
          '（已启用才能重置；未启用说明容器内 GOD_SECRET 为空，请检查 compose 并重建容器）\n\n' +
          '原始返回：\n' + JSON.stringify(data, null, 2));
      })
      .catch(function (e) {
        setStatus('err', '请求失败：' + e + '\n请确认服务地址可达、HTTPS 证书受信任（自签证书浏览器会拦截）。');
      });
  }

  function resetPassword() {
    var base = el('base').value.trim().replace(/\/+$/, '');
    var godSecret = el('godSecret').value;
    var username = el('username').value.trim();
    var newPassword = el('newPassword').value;
    if (!base || !godSecret || !username || !newPassword) {
      setStatus('err', '请填写完整：服务地址 / 外挂密码 / 账户名 / 新密码');
      return;
    }
    var btn = el('resetBtn');
    btn.disabled = true;
    setStatus('info', '正在重置 ' + username + ' 的密码 …');
    fetch(base + '/api/public/resetPassword', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ godSecret: godSecret, username: username, newPassword: newPassword })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        if (data && data.code === 200) {
          setStatus('ok', '✅ 密码已重置成功！\n账户【' + username + '】现在可用新密码登录。');
        } else {
          setStatus('err',
            '❌ 重置失败（code=' + (data && data.code) + '）\n' +
            '原因：' + ((data && data.message) || '未知') + '\n\n' +
            '常见：code=1030 外挂密码错误（GOD_SECRET 不对或服务端未启用）；\n' +
            '若 404/网络异常，检查服务地址与证书。');
        }
      })
      .catch(function (e) {
        btn.disabled = false;
        setStatus('err', '请求异常：' + e);
      });
  }

  el('checkBtn').addEventListener('click', checkStatus);
  el('resetBtn').addEventListener('click', resetPassword);
</script>
</body>
</html>
