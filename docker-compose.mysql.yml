# SurveyKing（hanyuestar/surveyking fork v1.0.5）—— MySQL 部署
#
# 适用场景：生产 / 多用户 / 数据量较大，使用 MySQL 8 作为数据库。
# 对应「SQLite 体验版」请见同目录 docker-compose.sqlite.yml（免装数据库）。
#
# 用法：
#   1. 在本仓库根目录执行（需先 clone 本仓库，MySQL 初始化脚本从仓库内挂载）：
#        docker compose -f docker-compose.mysql.yml up -d
#   2.（可选，推荐）部署前设置外挂密码：
#        export GOD_SECRET='your-strong-secret'
#        docker compose -f docker-compose.mysql.yml up -d
#   3. 打开浏览器访问 http://localhost:1991 ，默认账号 admin / 666666
#
# 镜像：直接从 Docker Hub 拉取已发布镜像 kyson666/surveyking:v1.0.5
#      （如需自行构建可用本仓库 server/api/Dockerfile + CI 流程，无需在本文件 build）。
#      国内若 Docker Hub 拉取慢，可改 ghcr.io/hanyuestar/surveyking:v1.0.5。
#
# 数据持久化：mysql-data（数据库）、app-files（上传文件）、app-logs（日志）
#   删除/重建容器不丢数据；如需彻底清理：docker compose -f docker-compose.mysql.yml down -v
#
# godSecret 说明：
#   - 仅部署时经环境变量 GOD_SECRET 注入，运行期不可修改（修改需重启容器）
#   - 未设置时功能关闭，登录页不显示钥匙按钮
#   - 用途：忘记管理员密码时，无需数据库直连即可重置任意账户密码（重置后旧 token 全部失效）
services:
  mysql:
    image: mysql:8.0
    container_name: surveyking-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: surveyking
      MYSQL_DATABASE: surveyking
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（空数据卷）时按序执行初始化脚本：
      # 01 建表 + 默认 admin 账户；02 预置行政区划字典（region，五级全量）
      # data-region-dict.sql.gz：MySQL 官方镜像原生支持 .sql.gz 自动解压执行
      - ./server/rdbms/src/main/resources/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/01-init-mysql.sql:ro
      - ./server/rdbms/src/main/resources/scripts/data-region-dict.sql.gz:/docker-entrypoint-initdb.d/02-data-region-dict.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    # v1.0.5 已发布（latest / v1.0.5 均可）；生产环境建议固定版本号以便回滚。
    image: kyson666/surveyking:v1.0.5
    container_name: surveyking-app
    restart: unless-stopped
    ports:
      - "1991:1991"
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: pro
      # 外挂密码：部署时经 .env / 环境变量注入，运行期不可改（空 = 禁用）
      GOD_SECRET: ${GOD_SECRET:-}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/surveyking?rewriteBatchedStatements=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: surveyking
      # JVM 参数：容器时区 + 堆内存（Dockerfile ENTRYPOINT 支持 ${JAVA_OPTS}）
      JAVA_OPTS: "-Xmx512m -Duser.timezone=Asia/Shanghai"
    volumes:
      # 与 server/api/Dockerfile 的 VOLUME /files、/logs 保持一致
      - app-files:/files
      - app-logs:/logs
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  app-files:
  app-logs:
